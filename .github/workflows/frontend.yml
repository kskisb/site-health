name: frontend

# どのプルリクエストでも必ず動かし、frontend に関係ない変更ならジョブを if で飛ばす。
# on.paths で動かなかったチェックは「待ち」のまま残り、必須にするとマージできなくなるため
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # プルリクエストは新しいpushで古い実行を止める。main は最後まで動かす
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter がプルリクエストの変更ファイルを読むため
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'openapi/**'
              - '.mise.toml'
              - '.github/workflows/frontend.yml'

  frontend:
    needs: changes
    # changes が失敗したときは、見逃さないようにテストを動かす（飛ばしたジョブは成功扱いになるため）
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('.mise.toml', 'frontend/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      # どれかが落ちても、残りのチェックも動かして結果をまとめて見る
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run test
        if: ${{ !cancelled() }}
      - run: npm run generate
        if: ${{ !cancelled() }}
